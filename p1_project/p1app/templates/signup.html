<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
  <title>Sign Up - Reservoir App</title>
  <style>
    body {
      background: linear-gradient(135deg, #2980b9, #6dd5fa, #ffffff);
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .signup-box {
      background-color: rgba(255, 255, 255, 0.9);
      padding: 60px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 500px;
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .signup-box h1 {
      font-size: 2.5rem;
      color: #333;
      margin-bottom: 20px;
    }

    .input-group {
      margin-bottom: 20px;
      position: relative;
    }

    .input-group input {
      width: 100%;
      padding: 12px 50px 12px 15px;
      border: 2px solid #ccc;
      border-radius: 30px;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .input-group input:focus {
      border-color: #3498db;
      outline: none;
      box-shadow: 0 0 15px rgba(52, 152, 219, 0.5);
    }

    .input-group i {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #777;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 30px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background-color: #2980b9;
      transform: translateY(-2px);
    }

    .error-message {
      color: #e74c3c;
      font-size: 1rem;
      margin-top: 15px;
    }
  </style>
</head>
<body>

<div class="signup-box">
  <h1>Sign Up</h1>

  <form method="GET">
    
    
    <!-- Username Input -->
    <div class="input-group">
      <input type="text" name="un" id="username" placeholder="Enter username" required>
      <i class="bi bi-person-circle"></i>
    </div>

    <!-- Password Input -->
    <div class="input-group">
      <input type="password" name="pw1" id="password1" placeholder="Enter password" required>
      <i class="bi bi-lock"></i>
    </div>

    <!-- Confirm Password Input -->
    <div class="input-group">
      <input type="password" name="pw2" id="password2" placeholder="Confirm password" required>
      <i class="bi bi-lock-fill"></i>
    </div>

    <!-- Submit Button -->
    <button type="submit">Register</button>
  </form>

  {% if msg %}
  <div class="error-message">{{ msg }}</div>
  {% endif %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
